name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      # Release when the manifest version has no release yet (bump version in ext-static/manifest.json → push to main)
      - name: Release new version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./ext-static/manifest.json').version")"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "$v already released"
          else
            gh release create "$v" dist/*.zip --target "$GITHUB_SHA" --title "$v" --generate-notes
          fi
